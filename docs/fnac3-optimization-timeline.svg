<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">FNaC3 dump optimization timeline</title>
  <desc id="desc">Horizontal bar chart showing FusionAssetLite FNaC3 dump wall-clock time decreasing from 13.29 seconds to 1.77 seconds across optimization milestones.</desc>
  <rect width="1400" height="980" fill="#f7f8fb"/>

  <text x="70" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">FNaC3 Dump Optimization Timeline</text>
  <text x="70" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">Wall-clock time for dumping 3,270 images, 138 sounds, 16 packed files, and 16 shaders</text>

  <rect x="1002" y="35" width="325" height="92" rx="8" fill="#ffffff" stroke="#d8dee9"/>
  <text x="1026" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">13.29s -&gt; 1.77s</text>
  <text x="1026" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f766e">7.5x faster, 86.7% less wall time</text>
  <text x="1026" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Latest measured zip median, 580.3 MB output</text>

  <line x1="450" y1="850" x2="1310" y2="850" stroke="#9ca3af" stroke-width="1"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">
    <line x1="450" y1="130" x2="450" y2="850" stroke="#e5e7eb"/>
    <text x="446" y="874" text-anchor="middle">0s</text>
    <line x1="573" y1="130" x2="573" y2="850" stroke="#e5e7eb"/>
    <text x="573" y="874" text-anchor="middle">2s</text>
    <line x1="696" y1="130" x2="696" y2="850" stroke="#e5e7eb"/>
    <text x="696" y="874" text-anchor="middle">4s</text>
    <line x1="819" y1="130" x2="819" y2="850" stroke="#e5e7eb"/>
    <text x="819" y="874" text-anchor="middle">6s</text>
    <line x1="941" y1="130" x2="941" y2="850" stroke="#e5e7eb"/>
    <text x="941" y="874" text-anchor="middle">8s</text>
    <line x1="1064" y1="130" x2="1064" y2="850" stroke="#e5e7eb"/>
    <text x="1064" y="874" text-anchor="middle">10s</text>
    <line x1="1187" y1="130" x2="1187" y2="850" stroke="#e5e7eb"/>
    <text x="1187" y="874" text-anchor="middle">12s</text>
    <line x1="1310" y1="130" x2="1310" y2="850" stroke="#e5e7eb"/>
    <text x="1310" y="874" text-anchor="middle">14s</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="158" font-size="16" font-weight="600" fill="#111827">Original GDI+ exporter</text>
    <text x="70" y="181" font-size="13" fill="#6b7280">System.Drawing PNG save, conservative workers</text>
    <rect x="450" y="139" width="816" height="38" rx="5" fill="#b91c1c"/>
    <text x="1284" y="164" font-size="16" font-weight="700" fill="#111827">13.29s</text>

    <text x="70" y="228" font-size="16" font-weight="600" fill="#111827">Custom PNG + workers + Server GC</text>
    <text x="70" y="251" font-size="13" fill="#6b7280">Removed GDI+, parallel image export, runtime GC settings</text>
    <rect x="450" y="209" width="382" height="38" rx="5" fill="#d97706"/>
    <text x="850" y="234" font-size="16" font-weight="700" fill="#111827">6.22s</text>

    <text x="70" y="298" font-size="16" font-weight="600" fill="#111827">Pooling + streaming IDAT</text>
    <text x="70" y="321" font-size="13" fill="#6b7280">ArrayPool ownership, fewer large allocations, no IDAT MemoryStream</text>
    <rect x="450" y="279" width="306" height="38" rx="5" fill="#ca8a04"/>
    <text x="774" y="304" font-size="16" font-weight="700" fill="#111827">4.98s</text>

    <text x="70" y="368" font-size="16" font-weight="600" fill="#111827">Mode-4 row translator cleanup</text>
    <text x="70" y="391" font-size="13" fill="#6b7280">Row-level validation and hoisted flags for FNaC3 mode-4 images</text>
    <rect x="450" y="349" width="283" height="38" rx="5" fill="#65a30d"/>
    <text x="751" y="374" font-size="16" font-weight="700" fill="#111827">4.61s</text>

    <text x="70" y="438" font-size="16" font-weight="600" fill="#111827">.NET 10 runtime</text>
    <text x="70" y="461" font-size="13" fill="#6b7280">Moved CLI to net10.0, GUI/tests to net10.0-windows</text>
    <rect x="450" y="419" width="251" height="38" rx="5" fill="#0891b2"/>
    <text x="719" y="444" font-size="16" font-weight="700" fill="#111827">4.09s</text>

    <text x="70" y="508" font-size="16" font-weight="600" fill="#111827">Direct RGBA + Crc32 + RGB PNG</text>
    <text x="70" y="531" font-size="13" fill="#6b7280">Removed swizzle pass, hardware/SIMD CRC, RGB output for opaque images</text>
    <rect x="450" y="489" width="241" height="38" rx="5" fill="#2563eb"/>
    <text x="709" y="514" font-size="16" font-weight="700" fill="#111827">3.92s</text>

    <text x="70" y="578" font-size="16" font-weight="600" fill="#111827">Output scan milestone</text>
    <text x="70" y="601" font-size="13" fill="#6b7280">Earlier A/B run with file-scan overhead removed from small-file output</text>
    <rect x="450" y="559" width="157" height="38" rx="5" fill="#0f766e"/>
    <text x="625" y="584" font-size="16" font-weight="700" fill="#111827">2.55s</text>

    <text x="70" y="648" font-size="16" font-weight="600" fill="#111827">Libdeflate + zip output</text>
    <text x="70" y="671" font-size="13" fill="#6b7280">One-shot PNG compression plus stored zip archive, no per-asset CreateFile</text>
    <rect x="450" y="629" width="129" height="38" rx="5" fill="#7c3aed"/>
    <text x="597" y="654" font-size="16" font-weight="700" fill="#111827">2.095s</text>

    <text x="70" y="718" font-size="16" font-weight="600" fill="#111827">Zip writer + inflate + SIMD</text>
    <text x="70" y="741" font-size="13" fill="#6b7280">Dedicated zip writer, libdeflate inflate, SSSE3 mode-4 rows, parallel sounds</text>
    <rect x="450" y="699" width="119" height="38" rx="5" fill="#be185d"/>
    <text x="587" y="724" font-size="16" font-weight="700" fill="#111827">1.943s</text>

    <text x="70" y="788" font-size="16" font-weight="600" fill="#111827">Fused scanlines + shader tail + review fixes</text>
    <text x="70" y="811" font-size="13" fill="#6b7280">Direct filtered scanline translation, vector alpha check, parallel shader writes</text>
    <rect x="450" y="769" width="109" height="38" rx="5" fill="#047857"/>
    <text x="577" y="794" font-size="16" font-weight="700" fill="#111827">1.77s</text>
  </g>

  <text x="70" y="922" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Notes: Windows file I/O is noisy; rows use representative or median measurements from the 2026-06-12 optimization session.</text>
  <text x="70" y="946" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Final bar: 3-run --zip median (1.69/1.773/1.777s) on the post-review build; folder output median 2.14s, peak RAM 856 MB, ~580 MB output.</text>
</svg>
